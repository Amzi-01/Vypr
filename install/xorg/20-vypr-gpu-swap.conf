# Keep Xorg off the card that gets handed to the VM.
#
# Installed as /etc/X11/xorg.conf.d/20-vypr-gpu-swap.conf, only when the GPU
# swap is enabled on an X11 desktop. Wayland needs none of this.
#
# Why it is needed:
#   Xorg opens every GPU it can see, not just the one drawing your screens. A
#   second card with nothing plugged into it still shows up as a client on it:
#
#       |    1   N/A  N/A   3408   G   /usr/lib/Xorg   4MiB |
#
#   Four megabytes and no output, but the device is open, so unbinding it from
#   the nvidia driver either fails outright or pulls the rug from under a
#   running X server. The swap cannot work while that handle exists, and no
#   amount of asking politely at swap time will close it - Xorg took it at
#   startup and holds it for the life of the session.
#
#   AutoAddGPU stops that. With it off, Xorg builds its screen from the Device
#   sections it was given and ignores every other GPU on the machine.
#
# What this does not do:
#   It does not choose which card runs your desktop. That is a Device/BusID
#   section, and on a machine where the firmware marks the passed-through card
#   as primary you need one of those as well or Xorg finds no usable screen at
#   all. If such a file already exists, leave it: this one only adds the flag.
#
# Takes effect at the next X session. Nothing changes until you log out and in.

Section "ServerFlags"
    Option "AutoAddGPU"  "false"
    # Newer servers split the binding half out under its own name. Harmless on
    # versions that do not know it.
    Option "AutoBindGPU" "false"
EndSection
