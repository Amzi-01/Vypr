<title id="t">Frame latency, Vypr 0.4.13 against 0.5.0</title>
<desc id="d">Milliseconds from Windows capturing a frame to Vypr publishing it, lower is better. 1920 × 1080 window: 5.98 ms before, 5.02 ms now; 2560 × 1440 window: 7.42 ms before, 6.29 ms now; 3200 × 1800 window: 10.80 ms before, 8.72 ms now; Whole 4K desktop: 13.82 ms before, 11.74 ms now.</desc>
