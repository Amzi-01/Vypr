<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 336" width="764" height="336" role="img" aria-labelledby="t d">
<title id="t">How a frame gets from a Windows app to your Linux desktop</title>
<desc id="d">In Windows, the app window is captured, read back from the GPU in eight bands, and written into a ring of locked pages in the VM's own memory. The host reads those pages in place through QEMU's memory file, with no copy, no codec and no driver; vyprd checks every page, the GPU imports the ring without a copy, and the frame appears as a native window. Keys and mouse go back over a socket.</desc>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#8b919c" stroke-width="1.3"/></marker></defs>
<text x="0" y="30" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.2" fill="#8b919c">IN WINDOWS, INSIDE THE VM</text>
<rect x="2" y="50" width="168" height="54" rx="6" fill="#151a21" stroke="#30353e" stroke-width="1"/>
<text x="86.0" y="75.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#f2f3f5">The app's window</text>
<text x="86.0" y="92.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b919c">any Windows app</text>
<rect x="199" y="50" width="168" height="54" rx="6" fill="#151a21" stroke="#30353e" stroke-width="1"/>
<text x="283.0" y="75.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#f2f3f5">Captured</text>
<text x="283.0" y="92.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b919c">per window, by Windows</text>
<rect x="396" y="50" width="168" height="54" rx="6" fill="#151a21" stroke="#30353e" stroke-width="1"/>
<text x="480.0" y="75.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#f2f3f5">Read back from the GPU</text>
<text x="480.0" y="92.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b919c">in 8 bands, overlapped</text>
<rect x="594" y="50" width="168" height="54" rx="6" fill="#151a21" stroke="#f2f3f5" stroke-width="1.6"/>
<text x="678.0" y="75.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#f2f3f5">Locked pages</text>
<text x="678.0" y="92.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b919c">in the VM's own RAM</text>
<line x1="174" y1="77.0" x2="195" y2="77.0" stroke="#8b919c" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="371" y1="77.0" x2="392" y2="77.0" stroke="#8b919c" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="568" y1="77.0" x2="590" y2="77.0" stroke="#8b919c" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="0" y1="160" x2="764" y2="160" stroke="#30353e" stroke-width="1.2" stroke-dasharray="2 6"/>
<text x="199" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c3c7cf">The VM boundary, crossed by reading the pages where they are</text>
<text x="199" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#f2f3f5">no copy, no codec, no driver</text>
<line x1="678.0" y1="108" x2="678.0" y2="232" stroke="#f2f3f5" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="199" y="222" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.2" fill="#8b919c">ON LINUX, YOUR DESKTOP</text>
<rect x="594" y="236" width="168" height="54" rx="6" fill="#151a21" stroke="#30353e" stroke-width="1"/>
<text x="678.0" y="261.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#f2f3f5">Checked page by page</text>
<text x="678.0" y="278.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b919c">vyprd, read-only</text>
<rect x="396" y="236" width="168" height="54" rx="6" fill="#151a21" stroke="#30353e" stroke-width="1"/>
<text x="480.0" y="261.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#f2f3f5">Handed to the GPU</text>
<text x="480.0" y="278.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b919c">zero-copy import</text>
<rect x="199" y="236" width="168" height="54" rx="6" fill="#151a21" stroke="#30353e" stroke-width="1"/>
<text x="283.0" y="261.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#f2f3f5">A native window</text>
<text x="283.0" y="278.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b919c">own taskbar entry</text>
<line x1="590" y1="263.0" x2="568" y2="263.0" stroke="#8b919c" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="392" y1="263.0" x2="371" y2="263.0" stroke="#8b919c" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M195,263.0 H86.0 V108" fill="none" stroke="#8b919c" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ah)"/>
<text x="2" y="285.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b919c">keys and mouse go</text>
<text x="2" y="300.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b919c">back over a socket</text>
</svg>
